# Baut den Windows-Installer (NSIS, Ein-Klick, pro Benutzer) auf einem echten Windows-Rechner
# und hängt ihn an das GitHub-Release. Läuft automatisch, sobald ein Release "vX.Y.Z" veröffentlicht wird.
name: Windows-Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v2.18.0"
        required: true

permissions:
  contents: write

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Abhängigkeiten
        working-directory: launcher
        run: npm ci
      - name: Installer bauen
        working-directory: launcher
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never --config.win.signAndEditExecutable=true
      - name: Signieren (für die Auto-Updates)
        working-directory: launcher
        shell: bash
        env:
          MYTIC_UPDATE_KEY: ${{ secrets.MYTIC_UPDATE_KEY }}
        run: |
          # Ohne Signatur nehmen installierte Launcher das Update nicht an – dann lieber abbrechen als still veröffentlichen
          if [ -z "$MYTIC_UPDATE_KEY" ]; then echo "::error::Secret MYTIC_UPDATE_KEY fehlt"; exit 1; fi
          umask 077
          printf '%s\n' "$MYTIC_UPDATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          MYTIC_SIGNING_KEY="$RUNNER_TEMP/update-key.pem" node scripts/sign.js dist/MyticClient-Setup-*.exe
          rm -f "$RUNNER_TEMP/update-key.pem"
      - name: An das Release hängen
        working-directory: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/MyticClient-Setup-*.exe dist/MyticClient-Setup-*.exe.sig --clobber --repo "${{ github.repository }}"
          # zusätzlich unter festem Namen: Website lädt direkt über releases/latest/download/MyticClient-Setup.exe
          cp dist/MyticClient-Setup-*.exe dist/MyticClient-Setup.exe
          gh release upload "$TAG" dist/MyticClient-Setup.exe --clobber --repo "${{ github.repository }}"
